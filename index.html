<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Inovação no Agro | Agrinho</title>

    <style>
        /* AQUI COMEÇA O CSS PARA DAR COR E TAMANHO */

        /* ESTILO PARA O BLOCO VERDE ESCURO (LEMBRANDO A FORÇA DA TERRA E PLANTAÇÃO) */
        .bloco-agro {
            background-color: #1b4d3e; /* DEFINE A COR DE FUNDO COMO VERDE ESCURO */
            padding: 25px; /* COLOCA UM ESPAÇO DENTRO DO BLOCO */
            font-family: 'Segoe UI', Arial, sans-serif; /* USA UMA FONTE MODERNA E LIMPA */
            text-align: center; /* ALINHA TODO O TEXTO NO MEIO */
            color: #ffffff; /* COLOCA A COR DA LETRA PRINCIPAL COMO BRANCO */
            border-radius: 8px; /* ARREDONDA AS BORDAS DO BLOCO PRINCIPAL */
        }

        /* ESTILO PARA A CAIXA QUE FICA NO CENTRO */
        .caixa-central {
            background-color: #f9f9f9; /* FUNDO CLARO PARA DAR DESTAQUE */
            border: 2px solid #d4af37; /* BORDA COR DE OURO/TRIGO DE 2 PIXELS */
            margin: 20px; /* EMPURRA AS COISAS DE FORA */
            padding: 20px; /* EMPURRA O TEXTO DE DENTRO */
            color: #2c3e50; /* MUDA A LETRA PARA UM CINZA ESCURO PARA LER MELHOR */
            border-radius: 6px;
        }

        /* ESTILO DO BOTÃO INTERATIVO (DOURADO DA COR DO TRIGO/
